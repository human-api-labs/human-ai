<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101828"><title>Human AI – Admin</title><style>body{font:16px system-ui;background:#f4f6fa;color:#182235;margin:0}header{background:#101828;color:white;padding:24px 18px}main{max-width:780px;margin:auto;padding:18px}h1{margin:0;font-size:23px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 1px 7px #15203912}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #ccd2de;border-radius:10px;font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;background:#175cd3;color:white;font-weight:600;margin:8px 7px 0 0;cursor:pointer}button.alt{background:#475467}button.danger{background:#b42318}.muted{color:#667085;font-size:14px}.stats{display:flex;gap:12px}.stats .card{flex:1;text-align:center}.stats strong{display:block;font-size:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{margin-top:12px}</style></head><body><header><h1>HUMAN AI · Aufträge</h1><div>Private Verwaltung</div></header><main><section class="card"><label for="key">Administrator-Schlüssel</label><input id="key" type="password" autocomplete="off" placeholder="ADMIN_TOKEN eingeben"><button id="load">Aufträge laden</button><button id="forget" class="alt">Schlüssel löschen</button><div id="message" class="muted">Der Schlüssel wird nur für diese Sitzung verwendet.</div></section><section class="stats"><div class="card"><strong id="open">–</strong>Offen</div><div class="card"><strong id="accepted">–</strong>Angenommen</div><div class="card"><strong id="declined">–</strong>Abgelehnt</div></section><section id="tasks" aria-live="polite"><div class="card muted">Noch keine Daten geladen.</div></section></main><script>
const key=document.getElementById('key'),msg=document.getElementById('message'),list=document.getElementById('tasks');let token='';
document.getElementById('load').onclick=()=>{token=key.value;refresh()};
document.getElementById('forget').onclick=()=>{token='';key.value='';list.textContent='Schlüssel gelöscht.'};
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
async function refresh(){if(!token){msg.textContent='Bitte Administrator-Schlüssel eingeben.';return}try{const r=await fetch('/api/v1/admin/tasks',{headers:{authorization:'Bearer '+token},cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||r.status);msg.textContent=data.persistent_storage?'Datenbank verbunden':'Achtung: Nur flüchtige Speicherung';const tasks=data.tasks||[];for(const [id,status] of [['open','awaiting_human'],['accepted','accepted'],['declined','declined']])document.getElementById(id).textContent=tasks.filter(t=>t.status===status).length;list.replaceChildren();if(!tasks.length)list.append(el('div','Noch keine Aufträge vorhanden.','card'));for(const t of tasks){const c=el('article','','card');c.append(el('h3',t.task||'Auftrag'),el('div','Status: '+t.status+' · '+(t.created_at||''),'muted'),el('div','ID: '+t.id,'muted'));if(t.location)c.append(el('p','Ort: '+t.location));if(t.budget)c.append(el('p','Budget: '+t.budget.amount+' '+t.budget.currency));if(t.requirements)c.append(el('p','Anforderungen: '+t.requirements.join(', ')));if(t.status==='awaiting_human')for(const [label,decision,cls] of [['Annehmen','accepted',''],['Ablehnen','declined','danger']]){const b=el('button',label,cls);b.onclick=()=>decide(t.id,decision);c.append(b)}list.append(c)}}catch(e){msg.textContent='Fehler: '+e.message}}
async function decide(id,decision){if(!confirm('Auftrag wirklich '+(decision==='accepted'?'annehmen':'ablehnen')+'?'))return;try{const r=await fetch('/api/v1/tasks/'+encodeURIComponent(id)+'/decision',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({decision})});if(!r.ok)throw Error((await r.json()).error);await refresh()}catch(e){msg.textContent='Fehler: '+e.message}}
</script></body></html>
