<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUMAN AI · Aufträge</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#101828;color:white;padding:24px max(20px,calc((100vw - 1100px)/2))}h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:#d0d5dd}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px #1018280a}label{display:block;font-weight:600;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:9px;padding:11px 15px;background:#295bd6;color:white;font-weight:600;cursor:pointer}button.secondary{background:#475467}button.danger{background:#b42318}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex-shrink:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{text-align:center}.metric strong{display:block;font-size:28px}.muted{color:#667085;font-size:14px}.warn{color:#a43a16}.ok{color:#087443}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.toolbar select{width:auto}.task{border:1px solid #e2e8f0;border-radius:12px;padding:17px;margin:12px 0}.task h3{margin:4px 0 10px;font-size:18px}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:#edf2fa;font-size:12px;font-weight:700}.task dl{display:grid;grid-template-columns:125px 1fr;gap:6px;margin:12px 0}.task dt{color:#667085}.task dd{margin:0;overflow-wrap:anywhere}.answer{margin-top:14px}.actions{margin-top:10px}.empty{text-align:center;padding:35px;color:#667085}.secret{max-width:650px}@media(max-width:600px){.metrics{grid-template-columns:repeat(2,1fr)}.task dl{grid-template-columns:1fr;gap:3px}.task dt{margin-top:7px}.panel{padding:15px}} 
</style></head><body><header><h1>HUMAN AI · Auftragszentrale</h1><p>Requests prüfen, beantworten und abschließen</p></header><main>
<section class="panel"><div class="secret"><label for="key">Administrator-Schlüssel</label><input type="password" id="key" autocomplete="off" placeholder="ADMIN_TOKEN eingeben"><div class="row" style="margin-top:10px"><button id="load">Aufträge laden</button><button id="forget" class="secondary">Abmelden</button><button id="refresh" class="secondary">Aktualisieren</button></div></div><p id="message" class="muted" role="status">Der Schlüssel bleibt nur in dieser Browser-Sitzung.</p></section>
<section class="metrics"><div class="panel metric"><strong id="open">–</strong>Offen</div><div class="panel metric"><strong id="accepted">–</strong>Angenommen</div><div class="panel metric"><strong id="completed">–</strong>Erledigt</div><div class="panel metric"><strong id="declined">–</strong>Abgelehnt</div></section>
<section class="panel"><div class="toolbar"><h2 style="margin:0">Auftragsliste</h2><select id="filter" aria-label="Aufträge filtern"><option value="all">Alle Aufträge</option><option value="awaiting_human">Offen</option><option value="accepted">Angenommen</option><option value="completed">Erledigt</option><option value="declined">Abgelehnt</option></select></div><div id="tasks" aria-live="polite" class="empty">Noch keine Daten geladen.</div></section>
</main><script>
const $=id=>document.getElementById(id);let token='',items=[];const statusNames={awaiting_human:'Offen',accepted:'Angenommen',completed:'Erledigt',declined:'Abgelehnt'};
function node(tag,content,cls){const n=document.createElement(tag);if(content!==undefined)n.textContent=String(content);if(cls)n.className=cls;return n}
function addLine(dl,k,v){if(v===undefined||v===null||v==='')return;dl.append(node('dt',k),node('dd',typeof v==='object'?JSON.stringify(v):v))}
function show(){const selected=$('filter').value;const list=$('tasks');list.replaceChildren();const shown=items.filter(t=>selected==='all'||t.status===selected);if(!shown.length){list.append(node('div','Keine passenden Aufträge.','empty'));return}
for(const t of shown){const card=node('article',undefined,'task');card.append(node('span',statusNames[t.status]||t.status,'tag'),node('h3',t.task||'Unbenannter Auftrag'));const dl=node('dl');addLine(dl,'Eingegangen',t.created_at?new Date(t.created_at).toLocaleString('de-DE'):undefined);addLine(dl,'Auftrags-ID',t.id);addLine(dl,'Ort',t.location);addLine(dl,'Frist',t.deadline);addLine(dl,'Budget',t.budget?t.budget.amount+' '+t.budget.currency:undefined);addLine(dl,'Anforderungen',Array.isArray(t.requirements)?t.requirements.join(', '):undefined);addLine(dl,'Antwort',t.human_response);card.append(dl);
if(['awaiting_human','accepted'].includes(t.status)){const wrap=node('div',undefined,'answer');const lbl=node('label','Antwort an den AI-Agenten');lbl.htmlFor='reply-'+t.id;const field=node('textarea');field.id='reply-'+t.id;field.placeholder='Ergebnis, Rückfrage oder Begründung eingeben …';field.value=t.human_response||'';wrap.append(lbl,field);const buttons=node('div',undefined,'row actions');
if(t.status==='awaiting_human'){const accept=node('button','Annehmen');accept.onclick=()=>decide(t,'accepted',field.value);const decline=node('button','Ablehnen','danger');decline.onclick=()=>decide(t,'declined',field.value);buttons.append(accept,decline)}
if(t.status==='accepted'){const done=node('button','Antwort senden & erledigen');done.onclick=()=>{if(!field.value.trim()){alert('Bitte zuerst eine Antwort eingeben.');return}decide(t,'completed',field.value)};buttons.append(done)}wrap.append(buttons);card.append(wrap)}list.append(card)}}
async function refresh(){if(!token){$('message').textContent='Bitte Administrator-Schlüssel eingeben.';return}try{const r=await fetch('/api/v1/admin/tasks',{headers:{authorization:'Bearer '+token},cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);items=data.tasks||[];items.sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));for(const [id,status] of [['open','awaiting_human'],['accepted','accepted'],['completed','completed'],['declined','declined']])$(id).textContent=items.filter(t=>t.status===status).length;$('message').textContent=data.persistent_storage?'Datenbank verbunden · Aufträge dauerhaft gespeichert':'WARNUNG: Datenbank nicht verbunden. Aufträge gehen beim Neustart verloren.';$('message').className=data.persistent_storage?'ok':'warn';show()}catch(e){$('message').textContent='Fehler beim Laden: '+e.message;$('message').className='warn'}}
async function decide(t,decision,response){if(!confirm('Auftrag '+(statusNames[decision]||decision).toLowerCase()+'?'))return;try{const r=await fetch('/api/v1/tasks/'+encodeURIComponent(t.id)+'/decision',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({decision,response})});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);await refresh()}catch(e){alert('Aktion fehlgeschlagen: '+e.message)}}
$('load').onclick=()=>{token=$('key').value.trim();refresh()};$('refresh').onclick=refresh;$('forget').onclick=()=>{token='';$('key').value='';items=[];$('message').textContent='Abgemeldet.';show()};$('filter').onchange=show;
</script></body></html>
